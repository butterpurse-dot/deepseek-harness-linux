name: Track external PRs

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: track-external-prs
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Update the external PR review queue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/track_external_prs.py
