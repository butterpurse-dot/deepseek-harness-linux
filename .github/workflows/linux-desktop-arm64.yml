name: Linux desktop arm64

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linux-desktop-arm64
  cancel-in-progress: false

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.28.5 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Linux packaging tests
        run: pnpm run test:linux

      - name: Install RPM tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm

      - name: Package arm64 artifacts
        working-directory: apps/desktop
        env:
          DSH_DESKTOP_UNSIGNED: '1'
          DSH_DESKTOP_TARGET_PLATFORM: linux
          DSH_DESKTOP_TARGET_ARCH: arm64
          DSH_DESKTOP_APP_ID: com.deepseek.harness
        run: pnpm run package:linux:arm64 -- --unsigned

      - name: Smoke-test the AppImage
        working-directory: apps/desktop/.desktop-build/targets/linux-arm64/unsigned-artifacts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          appimage="$(ls *.AppImage | head -1)"
          chmod +x "$appimage"
          timeout 150 xvfb-run -a env DSH_HOME=/tmp/dsh-smoke-home "./$appimage" \
            --appimage-extract-and-run --no-sandbox --user-data-dir=/tmp/dsh-smoke-userdata \
            > /tmp/appimage.log 2>&1 &
          pid=$!
          ready=0
          for _ in $(seq 1 60); do
            if grep -q "dsh web: http" /tmp/appimage.log; then ready=1; break; fi
            sleep 2
          done
          kill "$pid" 2>/dev/null || true
          pkill -f "dsh-smoke-userdata" 2>/dev/null || true
          pkill -f "appimage-extract-and-run" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          if [ "$ready" != "1" ]; then
            cat /tmp/appimage.log
            exit 1
          fi

      - name: Checksums
        working-directory: apps/desktop/.desktop-build/targets/linux-arm64/unsigned-artifacts
        run: sha256sum *.AppImage *.deb *.tar.gz *.rpm > SHA256SUMS.txt

      - name: Build arm64 update feed
        working-directory: apps/desktop
        run: |
          version="$(node -p "require('./package.json').version")"
          artifacts=".desktop-build/targets/linux-arm64/unsigned-artifacts"
          appimage="$(basename "$(ls "$artifacts"/*.AppImage | head -1)")"
          sha512="$(openssl dgst -sha512 -binary "$artifacts/$appimage" | base64 -w0)"
          size="$(stat -c %s "$artifacts/$appimage")"
          printf 'version: %s\nfiles:\n  - url: https://github.com/%s/releases/download/v%s-arm64/%s\n    sha512: %s\n    size: %s\npath: %s\nsha512: %s\nreleaseDate: %s\n' \
            "$version" "$GITHUB_REPOSITORY" "$version" "$appimage" "$sha512" "$size" "$appimage" "$sha512" \
            "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" > "$artifacts/latest-linux-arm64.yml"

      - name: Publish arm64 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          tag="v$version-arm64"
          artifacts="apps/desktop/.desktop-build/targets/linux-arm64/unsigned-artifacts"
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release delete "$tag" --repo "$GH_REPO" --yes --cleanup-tag
          fi
          gh release create "$tag" \
            "$artifacts"/*.AppImage "$artifacts"/*.deb "$artifacts"/*.tar.gz "$artifacts"/*.rpm "$artifacts/SHA256SUMS.txt" "$artifacts/latest-linux-arm64.yml" \
            scripts/install-linux.sh \
            --repo "$GH_REPO" --target "$GITHUB_SHA" --latest=false \
            --title "DeepSeek Harness $version (arm64)" \
            --notes "Linux arm64 build of DeepSeek Harness $version. The arm64 AppImage auto-updates via the arm64 feed published with the x64 release; manual downloads remain available."
