name: Linux desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linux-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-x64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.28.5 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Remove stale release for this version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release delete "$tag" --yes
          fi

      - name: Install RPM tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm

      - name: Package and publish
        working-directory: apps/desktop
        env:
          DSH_DESKTOP_UNSIGNED: '1'
          DSH_DESKTOP_TARGET_PLATFORM: linux
          DSH_DESKTOP_TARGET_ARCH: x64
          DSH_DESKTOP_APP_ID: com.deepseek.harness
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run package:linux:x64 -- --unsigned --publish

      - name: Run Linux packaging tests
        run: pnpm run test:linux

      - name: Smoke-test the AppImage
        working-directory: apps/desktop/.desktop-build/targets/linux-x64/unsigned-artifacts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          appimage="$(ls *.AppImage | head -1)"
          chmod +x "$appimage"
          timeout 150 xvfb-run -a env DSH_HOME=/tmp/dsh-smoke-home "./$appimage" \
            --appimage-extract-and-run --no-sandbox --user-data-dir=/tmp/dsh-smoke-userdata \
            > /tmp/appimage.log 2>&1 &
          pid=$!
          ready=0
          for _ in $(seq 1 60); do
            if grep -q "dsh web: http" /tmp/appimage.log; then ready=1; break; fi
            sleep 2
          done
          kill "$pid" 2>/dev/null || true
          pkill -f "dsh-smoke-userdata" 2>/dev/null || true
          pkill -f "appimage-extract-and-run" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          if [ "$ready" != "1" ]; then
            cat /tmp/appimage.log
            exit 1
          fi
          echo "AppImage started and served the host"

      - name: Checksums
        working-directory: apps/desktop/.desktop-build/targets/linux-x64/unsigned-artifacts
        run: sha256sum *.AppImage *.deb *.tar.gz *.rpm > SHA256SUMS.txt

      - name: Attach checksums and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          tag="v$version"
          artifacts="apps/desktop/.desktop-build/targets/linux-x64/unsigned-artifacts"
          sed "s/__VERSION__/$version/g" docs/RELEASE_NOTES.md > /tmp/release-notes.md
          gh release upload "$tag" "$artifacts/SHA256SUMS.txt" scripts/install-linux.sh --clobber
          gh release edit "$tag" --draft=false --notes-file /tmp/release-notes.md

      - name: Announce on X
        continue-on-error: true
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: |
          if [ -z "$X_BEARER_TOKEN" ] && [ -z "$X_API_KEY" ]; then
            echo "X credentials are not configured; skipping announcement."
            exit 0
          fi
          version="$(node -p "require('./apps/desktop/package.json').version")"
          python3 scripts/post_to_x.py \
            "DeepSeek Harness for Linux v$version is out: AppImage, deb, rpm, and tar.gz for x64/arm64, with checksums and AppImage auto-update. https://github.com/$GITHUB_REPOSITORY/releases/tag/v$version"
