name: Linux desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linux-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-x64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.28.5 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm run build

      - name: Prepare Desktop runtime
        working-directory: apps/desktop
        env:
          DSH_DESKTOP_UNSIGNED: '1'
          DSH_DESKTOP_TARGET_PLATFORM: linux
          DSH_DESKTOP_TARGET_ARCH: x64
          DSH_DESKTOP_APP_ID: com.deepseek.harness
        run: |
          pnpm run prepare:runtime
          pnpm run prepare:packages
          pnpm run prepare:dsh

      - name: Package AppImage, deb and tarball
        working-directory: apps/desktop
        env:
          DSH_DESKTOP_UNSIGNED: '1'
          DSH_DESKTOP_TARGET_PLATFORM: linux
          DSH_DESKTOP_TARGET_ARCH: x64
          DSH_DESKTOP_APP_ID: com.deepseek.harness
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec electron-builder --config electron-builder.config.mjs --linux --x64 --publish always

      - name: Checksums
        working-directory: apps/desktop/.desktop-build/targets/linux-x64/unsigned-artifacts
        run: sha256sum *.AppImage *.deb *.tar.gz > SHA256SUMS.txt

      - name: Attach checksums and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          tag="v$version"
          artifacts="apps/desktop/.desktop-build/targets/linux-x64/unsigned-artifacts"
          gh release upload "$tag" "$artifacts/SHA256SUMS.txt" --clobber
          if printf '%s' "$version" | grep -q -- '-'; then
            gh release edit "$tag" --draft=false --prerelease
          else
            gh release edit "$tag" --draft=false
          fi
