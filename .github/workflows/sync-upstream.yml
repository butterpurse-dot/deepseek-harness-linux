name: Sync upstream release

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    env:
      GH_REPO: ${{ github.repository }}
      # A push made with SYNC_TOKEN starts linux-desktop.yml through its tag
      # trigger, so the explicit start below is skipped to avoid a double build.
      PAT_PUSH: ${{ secrets.SYNC_TOKEN != '' && 'yes' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          # GITHUB_TOKEN may not push changes to workflow files, and upstream
          # releases change them. SYNC_TOKEN: fine-grained token, this repo only,
          # Contents + Workflows read/write.
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.28.5 --activate

      - name: Find the newest upstream release
        id: upstream
        run: |
          version="$(git ls-remote --tags --refs https://github.com/deepseek-ai/deepseek-harness.git 'dsh-v*' \
            | sed 's#.*refs/tags/dsh-v##' | sort -V | tail -1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=dsh-v$version" >> "$GITHUB_OUTPUT"

      - name: Compare versions
        id: compare
        run: |
          current="$(node -p "require('./apps/desktop/package.json').version")"
          target="${{ steps.upstream.outputs.version }}"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          newest="$(printf '%s\n%s\n' "$current" "$target" | sort -V | tail -1)"
          if [ "$newest" = "$target" ] && [ "$target" != "$current" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "update available: $current -> $target"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "up to date: $current (newest upstream release: $target)"
          fi

      - name: Release the current version
        if: steps.compare.outputs.needed != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current="${{ steps.compare.outputs.current }}"
          tag="v$current"
          tag_commit="$(git rev-parse -q --verify "$tag^{commit}" || true)"
          if [ -n "$tag_commit" ] && [ "$tag_commit" = "$(git rev-parse HEAD)" ]; then
            if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
              echo "release $tag is current"
              exit 0
            fi
            echo "release $tag is missing; dispatching x64 and arm64"
            gh workflow run linux-desktop.yml --repo "$GH_REPO" --ref "$tag"
            gh workflow run linux-desktop-arm64.yml --repo "$GH_REPO" --ref master
            exit 0
          fi
          if [ -n "$tag_commit" ] && git diff --quiet "$tag_commit..HEAD" -- \
            apps/desktop scripts/install-linux.sh package.json pnpm-lock.yaml; then
            echo "no release-relevant changes since $tag"
            exit 0
          fi
          echo "moving $tag to $(git rev-parse --short HEAD) and releasing"
          git tag -f "$tag" HEAD
          git push -f origin "$tag"
          [ -n "$PAT_PUSH" ] || gh workflow run linux-desktop.yml --repo "$GH_REPO" --ref "$tag"
          gh workflow run linux-desktop-arm64.yml --repo "$GH_REPO" --ref master

      - name: Rebase the Linux commits onto the new release
        if: steps.compare.outputs.needed == 'true'
        run: |
          target="${{ steps.upstream.outputs.tag }}"
          # Rebase rewrites commits, which needs a committer identity; authors are kept.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/deepseek-ai/deepseek-harness.git
          git fetch --tags --force upstream
          target_commit="$(git rev-parse "$target^{commit}")"
          old_email="butterpurse@gmail.com"
          noreply="248566377+butterpurse-dot@users.noreply.github.com"
          first="$(git log --reverse --format='%H %ae' master | awk -v a="$old_email" -v b="$noreply" '$2==a || $2==b {print $1; exit}')"
          if [ -z "$first" ]; then
            echo "::error::cannot locate the first Linux commit on master"
            exit 1
          fi
          old_base="$(git rev-parse "$first^")"
          echo "rebasing commits after $old_base onto $target ($target_commit)"
          # GitHub refuses pushes that publish the private address, so Linux
          # commits move to the account's noreply address as they are replayed.
          git rebase --onto "$target_commit" "$old_base" master --exec \
            "[ \"\$(git log -1 --format=%ae)\" != '$old_email' ] || git commit --amend --no-edit --quiet --author=\"\$(git log -1 --format=%an) <$noreply>\""

      - name: Verify the rebased tree
        if: steps.compare.outputs.needed == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm run test:linux

      - name: Push and start the release
        if: steps.compare.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.upstream.outputs.version }}"
          git push --force-with-lease origin master
          git tag -f "v$version" HEAD
          git push -f origin "v$version"
          [ -n "$PAT_PUSH" ] || gh workflow run linux-desktop.yml --repo "$GH_REPO" --ref "v$version"
          gh workflow run linux-desktop-arm64.yml --repo "$GH_REPO" --ref master

      - name: Keep scheduled workflows enabled
        if: steps.compare.outputs.needed != 'true'
        run: |
          last="$(git log -1 --format=%ct -- .github/keepalive 2>/dev/null || echo 0)"
          now="$(date +%s)"
          if [ $((now - last)) -gt 2592000 ]; then
            date -u +%FT%TZ > .github/keepalive
            git add .github/keepalive
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore: keep scheduled workflows enabled"
            git push origin master
          fi

      - name: Report a blocked sync
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create upstream-sync --repo "$GH_REPO" --color FBCA04 --description "Upstream sync blocked" 2>/dev/null || true
          body="Upstream sync failed for ${{ steps.upstream.outputs.tag || 'the current release' }}. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing="$(gh issue list --repo "$GH_REPO" --label upstream-sync --state open --json number --jq '.[0].number' || true)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GH_REPO" --body "$body"
          else
            gh issue create --repo "$GH_REPO" --title "Upstream sync blocked: ${{ steps.upstream.outputs.tag || 'unknown' }}" --label upstream-sync --body "$body"
          fi
